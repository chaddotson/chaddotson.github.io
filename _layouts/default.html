<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0d0f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" data-header>
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — home">
          <span class="brand-mark" aria-hidden="true">CD</span>
          <span class="brand-name">{{ site.title }}</span>
        </a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
          <span class="sr-only">Toggle navigation</span>
          <span></span><span></span>
        </button>

        <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
          <a href="#expertise">Expertise</a>
          <a href="#work">Work</a>
          <a href="#about">About</a>
          <a class="nav-cta" href="#contact">Let’s talk <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>© <span data-year>{{ "now" | date: "%Y" }}</span> {{ site.author.name }}</p>
        <p class="footer-note">Designed with intention. Built with Jekyll.</p>
        <a href="#main-content">Back to top <span aria-hidden="true">↑</span></a>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
