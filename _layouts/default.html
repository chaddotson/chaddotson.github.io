<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ee">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ "now" | date: "%Y" }} {{ site.author.name }}</p>
    </footer>
  </body>
</html>
